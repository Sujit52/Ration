<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAN Card Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 2.2rem;
            color: #333;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .logo p {
            color: #666;
            font-size: 1.1rem;
        }

        .search-box {
            margin-bottom: 25px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        #panInput {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #panInput:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        #searchBtn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #searchBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        #searchBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        .result-container {
            margin-top: 25px;
            display: none;
        }

        .result-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            text-align: left;
            border-left: 4px solid #667eea;
        }

        .success {
            border-left-color: #28a745;
            background: #f0fff4;
        }

        .error {
            border-left-color: #dc3545;
            background: #fff5f5;
        }

        .result-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }

        .result-item {
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        .result-label {
            font-weight: 600;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .result-value {
            color: #333;
            font-size: 1rem;
            font-weight: 500;
        }

        .api-info {
            background: #e8f4fd;
            border: 1px solid #667eea;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 12px;
            color: #2c3e50;
            text-align: left;
        }

        .api-info code {
            background: #2c3e50;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            word-break: break-all;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid #f5c6cb;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
                margin: 10px;
            }
            
            .logo h1 {
                font-size: 1.8rem;
            }
            
            .result-card {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .container {
                border-radius: 15px;
                padding: 25px 15px;
            }
            
            .logo h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>📄 PAN Card Verification</h1>
            <p>Verify PAN card details instantly</p>
        </div>

        <div class="search-box">
            <div class="input-group">
                <input type="text" id="panInput" placeholder="Enter PAN Number (e.g., ABCDE1234F)" maxlength="10" pattern="[A-Z]{5}[0-9]{4}[A-Z]{1}">
            </div>
            <button id="searchBtn" onclick="verifyPAN()">Verify PAN</button>
        </div>

        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p>Verifying PAN details...</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="result-container" id="resultContainer">
            <div class="result-card" id="resultCard">
                <div class="result-title" id="resultTitle">PAN Verification Result</div>
                <div class="result-item">
                    <div class="result-label">Full Name</div>
                    <div class="result-value" id="fullName">-</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Status</div>
                    <div class="result-value" id="status">-</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Message</div>
                    <div class="result-value" id="message">-</div>
                </div>
            </div>
        </div>

      
    </div>

    <script>
        async function verifyPAN() {
            const panInput = document.getElementById('panInput');
            const searchBtn = document.getElementById('searchBtn');
            const loadingDiv = document.getElementById('loading');
            const errorDiv = document.getElementById('errorMessage');
            const resultContainer = document.getElementById('resultContainer');
            const resultCard = document.getElementById('resultCard');
            const fullName = document.getElementById('fullName');
            const status = document.getElementById('status');
            const message = document.getElementById('message');
            const resultTitle = document.getElementById('resultTitle');

            const panNumber = panInput.value.trim().toUpperCase();

            // PAN validation regex
            const panRegex = /^[A-Z]{5}[0-9]{4}[A-Z]{1}$/;

            if (!panNumber) {
                showError('Please enter a PAN number');
                return;
            }

            if (!panRegex.test(panNumber)) {
                showError('Please enter a valid PAN number (Format: ABCDE1234F)');
                return;
            }

            // Reset UI
            errorDiv.style.display = 'none';
            resultContainer.style.display = 'none';
            searchBtn.disabled = true;
            loadingDiv.style.display = 'block';

            try {
                const timestamp = Date.now();
                const apiUrl = `https://danamojo.org/dm/widget/onlinepanverification?pan=${panNumber}&ngoId=1202&_=${timestamp}`;
                
                console.log('API URL:', apiUrl);

                const headers = {
                    'User-Agent': 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Mobile Safari/537.36',
                };

                const response = await fetch(apiUrl, { 
                    method: 'GET',
                    headers: headers
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                console.log('API Response:', data);

                loadingDiv.style.display = 'none';
                searchBtn.disabled = false;

                // Display results
                if (data.status === "SUCCESS") {
                    resultCard.className = 'result-card success fade-in';
                    resultTitle.textContent = '✅ PAN Verification Successful';
                    fullName.textContent = data.fullname || 'N/A';
                    status.textContent = data.status || 'N/A';
                    message.textContent = data.message || 'N/A';
                } else {
                    resultCard.className = 'result-card error fade-in';
                    resultTitle.textContent = '❌ PAN Verification Failed';
                    fullName.textContent = 'N/A';
                    status.textContent = data.status || 'ERROR';
                    message.textContent = data.message || 'Unknown error occurred';
                }

                resultContainer.style.display = 'block';

            } catch (error) {
                console.error('Verification error:', error);
                loadingDiv.style.display = 'none';
                searchBtn.disabled = false;
                showError(`Failed to verify PAN: ${error.message}`);
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // Auto-format PAN input
        document.getElementById('panInput').addEventListener('input', function(e) {
            this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 10);
        });

        // Search on Enter key
        document.getElementById('panInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                verifyPAN();
            }
        });

        // Clear results when input changes
        document.getElementById('panInput').addEventListener('input', function(e) {
            if (this.value.length === 0) {
                document.getElementById('resultContainer').style.display = 'none';
                document.getElementById('errorMessage').style.display = 'none';
            }
        });

        // Validate PAN format in real-time
        document.getElementById('panInput').addEventListener('blur', function(e) {
            const panNumber = this.value.trim();
            const panRegex = /^[A-Z]{5}[0-9]{4}[A-Z]{1}$/;
            
            if (panNumber && !panRegex.test(panNumber)) {
                this.style.borderColor = '#dc3545';
            } else {
                this.style.borderColor = '#e1e5e9';
            }
        });
    </script>
</body>
</html>
