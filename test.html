<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number & Aadhaar Lookup</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            margin-top: 30px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
            font-weight: 600;
        }
        
        .toggle-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .toggle-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        
        .toggle-btn {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            background: #f1f2f6;
            color: #2c3e50;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .toggle-btn.active {
            background: #3498db;
            color: white;
            box-shadow: 0 4px 8px rgba(52, 152, 219, 0.3);
        }
        
        .toggle-btn:hover:not(.active) {
            background: #dfe4ea;
        }
        
        .field {
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }
        
        .field:focus-within {
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }
        
        .field i {
            color: #7f8c8d;
            margin-right: 10px;
            font-size: 18px;
        }
        
        .field input {
            border: none;
            outline: none;
            font-size: 16px;
            width: 100%;
        }
        
        .search-btn {
            width: 100%;
            padding: 14px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 20px;
        }
        
        .search-btn:hover {
            background: #27ae60;
        }
        
        #output {
            min-height: 50px;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #3498db;
        }
        
        .loading i {
            animation: spin 1s linear infinite;
            font-size: 24px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border-left: 4px solid #3498db;
        }
        
        .result-card p {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        
        .result-card i {
            margin-right: 10px;
            width: 20px;
            color: #3498db;
        }
        
        .error-card {
            background: #ffeaa7;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            border-left: 4px solid #fdcb6e;
            color: #d63031;
            font-weight: 500;
        }
        
        #toTop {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
        }
        
        #toTop:hover {
            background: #2980b9;
            transform: translateY(-3px);
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .toggle-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="top">
        <h1>Number & Aadhaar Lookup</h1>
        <div class="toggle-container">
            <div class="toggle-row">
                <button id="mobileBtn" class="toggle-btn active" onclick="toggleInput('mobile')">
                    <i class="fa-solid fa-phone"></i> Mobile
                </button>
                <button id="aadhaarBtn" class="toggle-btn" onclick="toggleInput('aadhaar')">
                    <i class="fa-solid fa-id-card"></i> Aadhaar
                </button>
            </div>
            <div class="toggle-row">
                <button id="rationBtn" class="toggle-btn" onclick="toggleInput('ration')">
                    <i class="fa-solid fa-receipt"></i> Ration
                </button>
                <button id="vehicleBtn" class="toggle-btn" onclick="toggleInput('vehicle')">
                    <i class="fa-solid fa-car"></i> Vehicle
                </button>
            </div>
        </div>
        
        <div class="field" id="mobileField">
            <i class="fa-solid fa-phone"></i>
            <input type="tel" id="mobile" placeholder="Enter 10-digit Mobile Number" maxlength="10">
        </div>
        
        <div class="field" id="aadhaarField" style="display:none">
            <i class="fa-solid fa-id-card"></i>
            <input type="tel" id="aadhaar" placeholder="Enter 12-digit Aadhaar Number" maxlength="12">
        </div>
        
        <div class="field" id="rationField" style="display:none">
            <i class="fa-solid fa-receipt"></i>
            <input type="tel" id="ration" placeholder="Enter Aadhaar Number for Ration Card" maxlength="12">
        </div>
        
        <div class="field" id="vehicleField" style="display:none">
            <i class="fa-solid fa-car"></i>
            <input type="text" id="vehicle" placeholder="Enter Vehicle Number (e.g., JK05F1806)" maxlength="15">
        </div>
        
        <button class="search-btn" onclick="search()">Search</button>
        <div id="output"></div>
    </div>

    <button id="toTop" onclick="scrollToTop()"><i class="fa-solid fa-arrow-up"></i></button>

    <script>
        let currentInput = 'mobile';
        
        function toggleInput(type) {
            currentInput = type;
            
            // Hide all input fields
            document.getElementById('mobileField').style.display = 'none';
            document.getElementById('aadhaarField').style.display = 'none';
            document.getElementById('rationField').style.display = 'none';
            document.getElementById('vehicleField').style.display = 'none';
            
            // Remove active class from all buttons
            document.getElementById('mobileBtn').classList.remove('active');
            document.getElementById('aadhaarBtn').classList.remove('active');
            document.getElementById('rationBtn').classList.remove('active');
            document.getElementById('vehicleBtn').classList.remove('active');
            
            // Show the selected input field and activate its button
            if(type === 'mobile') {
                document.getElementById('mobileField').style.display = 'flex';
                document.getElementById('mobileBtn').classList.add('active');
            } else if(type === 'aadhaar') {
                document.getElementById('aadhaarField').style.display = 'flex';
                document.getElementById('aadhaarBtn').classList.add('active');
            } else if(type === 'ration') {
                document.getElementById('rationField').style.display = 'flex';
                document.getElementById('rationBtn').classList.add('active');
            } else if(type === 'vehicle') {
                document.getElementById('vehicleField').style.display = 'flex';
                document.getElementById('vehicleBtn').classList.add('active');
            }
        }

        window.onscroll = function() {
            document.getElementById('toTop').style.display = 
                (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) ? 'flex' : 'none';
        };

        function scrollToTop() {
            document.getElementById('top').scrollIntoView({behavior: "smooth"});
        }

        async function search() {
            let mobile = document.getElementById('mobile').value.trim();
            let aadhaar = document.getElementById('aadhaar').value.trim();
            let ration = document.getElementById('ration').value.trim();
            let vehicle = document.getElementById('vehicle').value.trim();
            let output = document.getElementById('output');
            output.innerHTML = '<div class="loading"><i class="fa-solid fa-spinner"></i> Searching...</div>';
            let url = '';

            // Validate inputs and set API URLs
            if(currentInput === 'mobile' && mobile.length === 10 && /^\d{10}$/.test(mobile)) {
                url = `https://n2d.vercel.app/api?key=freeApi&number=${mobile}`;
            } else if(currentInput === 'aadhaar' && aadhaar.length === 12 && /^\d{12}$/.test(aadhaar)) {
                url = `https://n2d.vercel.app/api?key=freeApi&aadhaar_number=${aadhaar}`;
            } else if(currentInput === 'ration' && ration.length === 12 && /^\d{12}$/.test(ration)) {
                url = `https://apibymynk.vercel.app/fetch?key=onlymynk&aadhaar=${ration}`;
            } else if(currentInput === 'vehicle' && vehicle.length > 0) {
                url = `http://dark-op.dev-is.xyz/?key=wasdark&vehicle=${vehicle}`;
            } else {
                output.innerHTML = '<div class="error-card">Please enter a valid number</div>';
                return;
            }

            try {
                let response = await fetch(url);
                let data = await response.json();
                
                // Handle different API response formats
                if(currentInput === 'mobile' || currentInput === 'aadhaar') {
                    // Mobile/Aadhaar API response
                    if(data.status === "success") {
                        let html = '';
                        data.data.forEach(item => {
                            html += `<div class="result-card">
                                <p><i class="fa-solid fa-user"></i><strong>Name:</strong> ${item.name}</p>
                                <p><i class="fa-solid fa-user-pen"></i><strong>Father's Name:</strong> ${item.father_name}</p>
                                <p><i class="fa-solid fa-phone"></i><strong>Mobile:</strong> ${item.mobile}</p>
                                <p><i class="fa-solid fa-phone-volume"></i><strong>Alt Mobile:</strong> ${item.alt_mobile || 'N/A'}</p>
                                <p><i class="fa-solid fa-signal"></i><strong>Circle:</strong> ${item.circle}</p>
                                <p><i class="fa-solid fa-id-card"></i><strong>Aadhaar:</strong> ${item.aadhaar_number || 'N/A'}</p>
                                <p><i class="fa-solid fa-location-dot"></i><strong>Address:</strong> ${item.address}</p>
                                <p><i class="fa-solid fa-envelope"></i><strong>Email:</strong> ${item.email || 'N/A'}</p>
                            </div>`;
                        });
                        output.innerHTML = html;
                    } else {
                        output.innerHTML = `<div class="error-card">${data.data[0].error || 'No data found'}</div>`;
                    }
                } else if(currentInput === 'ration') {
                    // Ration API response
                    if(data.success) {
                        let html = `<div class="result-card">
                            <p><i class="fa-solid fa-user"></i><strong>Name:</strong> ${data.name || 'N/A'}</p>
                            <p><i class="fa-solid fa-id-card"></i><strong>Aadhaar Number:</strong> ${ration}</p>
                            <p><i class="fa-solid fa-receipt"></i><strong>Ration Card Number:</strong> ${data.ration_number || 'N/A'}</p>
                            <p><i class="fa-solid fa-users"></i><strong>Family Members:</strong> ${data.family_members || 'N/A'}</p>
                            <p><i class="fa-solid fa-location-dot"></i><strong>Address:</strong> ${data.address || 'N/A'}</p>
                            <p><i class="fa-solid fa-calendar"></i><strong>Valid Till:</strong> ${data.valid_till || 'N/A'}</p>
                        </div>`;
                        output.innerHTML = html;
                    } else {
                        output.innerHTML = `<div class="error-card">${data.message || 'No ration card found for this Aadhaar number'}</div>`;
                    }
                } else if(currentInput === 'vehicle') {
                    // Vehicle API response
                    if(data.success) {
                        let html = `<div class="result-card">
                            <p><i class="fa-solid fa-car"></i><strong>Vehicle Number:</strong> ${data.vehicle_number || vehicle}</p>
                            <p><i class="fa-solid fa-user"></i><strong>Owner Name:</strong> ${data.owner_name || 'N/A'}</p>
                            <p><i class="fa-solid fa-id-card"></i><strong>Registration Date:</strong> ${data.registration_date || 'N/A'}</p>
                            <p><i class="fa-solid fa-car-side"></i><strong>Vehicle Type:</strong> ${data.vehicle_type || 'N/A'}</p>
                            <p><i class="fa-solid fa-industry"></i><strong>Manufacturer:</strong> ${data.manufacturer || 'N/A'}</p>
                            <p><i class="fa-solid fa-calendar"></i><strong>Model Year:</strong> ${data.model_year || 'N/A'}</p>
                            <p><i class="fa-solid fa-location-dot"></i><strong>Registered State:</strong> ${data.registered_state || 'N/A'}</p>
                        </div>`;
                        output.innerHTML = html;
                    } else {
                        output.innerHTML = `<div class="error-card">${data.message || 'No vehicle found with this number'}</div>`;
                    }
                }
            } catch(err) {
                console.error(err);
                output.innerHTML = `<div class="error-card">Something went wrong. Try again later.</div>`;
            }
        }
    </script>
</body>
</html>
