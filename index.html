<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ration & Vehicle Search</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 30px;
            width: 100%;
            max-width: 700px;
            text-align: center;
        }
        
        .logo {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #2c3e50;
            font-weight: 600;
        }
        
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .toggle-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 10px;
        }
        
        .toggle-btn {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            background: #e9ecef;
            color: #2c3e50;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .toggle-btn.active {
            background: #667eea;
            color: white;
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
        }
        
        .toggle-btn:hover:not(.active) {
            background: #dee2e6;
        }
        
        .field {
            display: flex;
            align-items: center;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 20px;
            transition: all 0.3s;
            background: #f8f9fa;
        }
        
        .field:focus-within {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: white;
        }
        
        .field i {
            color: #667eea;
            margin-right: 15px;
            font-size: 20px;
            width: 25px;
        }
        
        .field input {
            border: none;
            outline: none;
            font-size: 16px;
            width: 100%;
            background: transparent;
        }
        
        .search-btn {
            width: 100%;
            padding: 16px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .search-btn:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
        }
        
        .search-btn:active {
            transform: translateY(0);
        }
        
        .search-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .info-box {
            background: #e8f4fd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #3498db;
        }
        
        .info-box p {
            margin: 5px 0;
            color: #2c3e50;
            font-size: 14px;
        }
        
        #output {
            min-height: 50px;
            width: 100%;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
            color: #667eea;
        }
        
        .loading i {
            animation: spin 1s linear infinite;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #2ecc71;
            text-align: left;
        }
        
        .result-card h3 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        
        .result-section {
            margin-bottom: 20px;
        }
        
        .result-section h4 {
            color: #667eea;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #ddd;
        }
        
        .result-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 8px;
            padding: 5px 0;
        }
        
        .result-item i {
            color: #667eea;
            margin-right: 12px;
            margin-top: 2px;
            width: 16px;
            text-align: center;
        }
        
        .result-item strong {
            color: #2c3e50;
            min-width: 200px;
            display: inline-block;
        }
        
        .result-item span {
            color: #34495e;
            flex: 1;
        }
        
        .family-member {
            background: #fff;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 3px solid #3498db;
        }
        
        .family-member h5 {
            color: #2c3e50;
            margin-bottom: 8px;
        }
        
        .challan-item {
            background: #fff;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 3px solid #e74c3c;
        }
        
        .challan-item h5 {
            color: #e74c3c;
            margin-bottom: 8px;
        }
        
        .error-card {
            background: #ffeaa7;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            border-left: 5px solid #fdcb6e;
            color: #d63031;
            font-weight: 500;
        }
        
        .success-message {
            background: #d1f7e4;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border-left: 5px solid #2ecc71;
            color: #27ae60;
            margin-bottom: 20px;
        }
        
        .demo-data {
            background: #fff3cd;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            border-left: 4px solid #ffc107;
        }
        
        .footer {
            margin-top: 30px;
            text-align: center;
            color: white;
            font-size: 14px;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
                margin: 10px;
            }
            
            .toggle-container {
                flex-direction: column;
            }
            
            .result-item {
                flex-direction: column;
            }
            
            .result-item strong {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="top">
        <div class="logo">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <h1>Ration & Vehicle Search</h1>
      
        
        <div class="toggle-container">
            <button id="rationBtn" class="toggle-btn active" onclick="toggleSearch('ration')">
                <i class="fa-solid fa-receipt"></i> Ration Card
            </button>
            <button id="vehicleBtn" class="toggle-btn" onclick="toggleSearch('vehicle')">
                <i class="fa-solid fa-car"></i> Vehicle
            </button>
        </div>
        
        <div class="field" id="rationField">
            <i class="fa-solid fa-id-card"></i>
            <input type="tel" id="ration" placeholder="Enter 12-digit Aadhaar Number" maxlength="12" inputmode="numeric">
        </div>
        
        <div class="field" id="vehicleField" style="display: none;">
            <i class="fa-solid fa-car"></i>
            <input type="text" id="vehicle" placeholder="Enter Vehicle Number (e.g. JK05F1806)" maxlength="15">
        </div>
        
        <button class="search-btn" onclick="search()" id="searchBtn">
            <i class="fa-solid fa-search"></i> Search
        </button>
        
        <div class="info-box">
            <p id="infoText">
                <i class="fa-solid fa-info-circle"></i> 
                <strong>Ration Card:</strong> Enter 12-digit Aadhaar number to search ration card details
            </p>
        </div>
        
        <div id="output"></div>

        <div class="demo-data">
            <h4><i class="fa-solid fa-database"></i> Quick Test</h4>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button onclick="fillDemoRation()" style="flex: 1; padding: 8px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer;">
                    <i class="fa-solid fa-receipt"></i> Demo Ration
                </button>
                <button onclick="fillDemoVehicle()" style="flex: 1; padding: 8px; background: #9b59b6; color: white; border: none; border-radius: 5px; cursor: pointer;">
                    <i class="fa-solid fa-car"></i> Demo Vehicle
                </button>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>SDK Search Portal &copy; 2025</p>
    </div>

    <script>
        let currentSearch = 'ration';
        
        // Working CORS Proxies
        const CORS_PROXIES = [
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?',
            'https://api.allorigins.win/raw?url=',
            'https://proxy.cors.sh/',
            'https://cors-anywhere.herokuapp.com/'
            'https://api.allorigins.win/raw?url='
        ];

        let currentProxyIndex = 0;

        function getProxyUrl(url) {
            return CORS_PROXIES[currentProxyIndex] + encodeURIComponent(url);
        }

        function rotateProxy() {
            currentProxyIndex = (currentProxyIndex + 1) % CORS_PROXIES.length;
            console.log('Switched to proxy:', CORS_PROXIES[currentProxyIndex]);
        }

        function toggleSearch(type) {
            currentSearch = type;
            
            // Hide all fields
            document.getElementById('rationField').style.display = 'none';
            document.getElementById('vehicleField').style.display = 'none';
            
            // Remove active class from all buttons
            document.getElementById('rationBtn').classList.remove('active');
            document.getElementById('vehicleBtn').classList.remove('active');
            
            // Show selected field and activate button
            if(type === 'ration') {
                document.getElementById('rationField').style.display = 'flex';
                document.getElementById('rationBtn').classList.add('active');
                document.getElementById('infoText').innerHTML = `
                    <i class="fa-solid fa-info-circle"></i> 
                    <strong>Ration Card:</strong> Enter 12-digit Aadhaar number to search ration card details
                `;
            } else {
                document.getElementById('vehicleField').style.display = 'flex';
                document.getElementById('vehicleBtn').classList.add('active');
                document.getElementById('infoText').innerHTML = `
                    <i class="fa-solid fa-info-circle"></i> 
                    <strong>Vehicle:</strong> Enter vehicle number to search vehicle details
                `;
            }
            
            // Clear output
            document.getElementById('output').innerHTML = '';
        }

        async function search() {
            let output = document.getElementById('output');
            let searchBtn = document.getElementById('searchBtn');
            
            // Reset output
            output.innerHTML = '';
            
            // Show loading
            output.innerHTML = `
                <div class="loading">
                    <i class="fa-solid fa-spinner"></i>
                    <p>Searching ${currentSearch === 'ration' ? 'ration card' : 'vehicle'} details...</p>
                    <p style="font-size: 14px; color: #7f8c8d; margin-top: 10px;">Using proxy ${currentProxyIndex + 1}/${CORS_PROXIES.length}</p>
                </div>
            `;
            
            // Disable button during search
            searchBtn.disabled = true;
            searchBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Searching...';
            
            try {
                if(currentSearch === 'ration') {
                    await searchRation();
                } else {
                    await searchVehicle();
                }
            } catch(err) {
                console.error('Search error:', err);
                
                // Try next proxy
                if(currentProxyIndex < CORS_PROXIES.length - 1) {
                    output.innerHTML = `
                        <div class="loading">
                            <i class="fa-solid fa-sync-alt"></i>
                            <p>Proxy failed, trying next one...</p>
                        </div>
                    `;
                    rotateProxy();
                    setTimeout(() => search(), 1000);
                    return;
                }
                
                // All proxies failed
                output.innerHTML = `
                    <div class="error-card">
                        <i class="fa-solid fa-exclamation-triangle"></i>
                        <p>Search failed: ${err.message}</p>
                        <p style="margin-top: 10px; font-size: 14px;">Refresh and try again...</p>
                        <button onclick="showDemoData()" style="margin-top: 10px; padding: 8px 15px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">
                            Show Demo Data
                        </button>
                    </div>
                `;
            } finally {
                // Re-enable button
                searchBtn.disabled = false;
                searchBtn.innerHTML = '<i class="fa-solid fa-search"></i> Search';
            }
        }

        async function searchRation() {
            let ration = document.getElementById('ration').value.trim();
            
            // Validation
            if(ration.length !== 12 || !/^\d{12}$/.test(ration)) {
                throw new Error('Please enter a valid 12-digit Aadhaar number');
            }

            const originalUrl = `https://apibymynk.vercel.app/fetch?key=onlymynk&aadhaar=${ration}`;
            const proxyUrl = getProxyUrl(originalUrl);
            
            console.log('Ration API URL:', proxyUrl);
            
            let response = await fetch(proxyUrl);
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            let data = await response.json();
            console.log('Ration API Response:', data);
            
            displayRationResults(data, ration);
        }

        async function searchVehicle() {
            let vehicle = document.getElementById('vehicle').value.trim().toUpperCase();
            
            // Validation
            if(vehicle.length === 0) {
                throw new Error('Please enter a vehicle number');
            }

            const originalUrl = `http://dark-op.dev-is.xyz/?key=wasdark&vehicle=${vehicle}`;
            const proxyUrl = getProxyUrl(originalUrl);
            
            console.log('Vehicle API URL:', proxyUrl);
            
            let response = await fetch(proxyUrl);
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            let data = await response.json();
            console.log('Vehicle API Response:', data);
            
            displayVehicleResults(data, vehicle);
        }

        function displayRationResults(data, ration) {
            let output = document.getElementById('output');
            
            if(data && data.rcId) {
                let html = `
                    <div class="success-message">
                        <i class="fa-solid fa-check-circle"></i> Ration card details found successfully!
                    </div>
                    <div class="result-card">
                        <h3><i class="fa-solid fa-receipt"></i> Ration Card Details</h3>
                        
                        <div class="result-section">
                            <h4><i class="fa-solid fa-info-circle"></i> Basic Information</h4>
                            <div class="result-item">
                                <i class="fa-solid fa-id-card"></i>
                                <strong>Ration Card ID:</strong>
                                <span>${data.rcId || 'N/A'}</span>
                            </div>
                            <div class="result-item">
                                <i class="fa-solid fa-id-card"></i>
                                <strong>Aadhaar Number:</strong>
                                <span>${ration}</span>
                            </div>
                            <div class="result-item">
                                <i class="fa-solid fa-tag"></i>
                                <strong>Scheme Name:</strong>
                                <span>${data.schemeName || 'N/A'}</span>
                            </div>
                            <div class="result-item">
                                <i class="fa-solid fa-tag"></i>
                                <strong>Scheme ID:</strong>
                                <span>${data.schemeId || 'N/A'}</span>
                            </div>
                            <div class="result-item">
                                <i class="fa-solid fa-check-circle"></i>
                                <strong>ONORC Allowed:</strong>
                                <span>${data.allowed_onorc || 'N/A'}</span>
                            </div>
                            <div class="result-item">
                                <i class="fa-solid fa-store"></i>
                                <strong>FPS ID:</strong>
                                <span>${data.fpsId || 'N/A'}</span>
                            </div>
                        </div>
                        
                        <div class="result-section">
                            <h4><i class="fa-solid fa-location-dot"></i> Address Details</h4>
                            <div class="result-item">
                                <i class="fa-solid fa-location-dot"></i>
                                <strong>District:</strong>
                                <span>${data.homeDistName || 'N/A'}</span>
                            </div>
                            <div class="result-item">
                                <i class="fa-solid fa-map"></i>
                                <strong>State:</strong>
                                <span>${data.homeStateName || 'N/A'} (${data.homeStateCode || 'N/A'})</span>
                            </div>
                            <div class="result-item">
                                <i class="fa-solid fa-map-pin"></i>
                                <strong>District Code:</strong>
                                <span>${data.districtCode || 'N/A'}</span>
                            </div>
                            <div class="result-item">
                                <i class="fa-solid fa-home"></i>
                                <strong>Address:</strong>
                                <span>${data.address || 'N/A'}</span>
                            </div>
                        </div>
                `;
                
                // Add family members section
                if(data.memberDetailsList && data.memberDetailsList.length > 0) {
                    html += `
                        <div class="result-section">
                            <h4><i class="fa-solid fa-users"></i> Family Members (${data.memberDetailsList.length})</h4>
                    `;
                    
                    data.memberDetailsList.forEach((member, index) => {
                        html += `
                            <div class="family-member">
                                <h5><i class="fa-solid fa-user"></i> ${member.memberName || 'N/A'}</h5>
                                <div class="result-item">
                                    <i class="fa-solid fa-id-badge"></i>
                                    <strong>Member ID:</strong>
                                    <span>${member.memberId || 'N/A'}</span>
                                </div>
                                <div class="result-item">
                                    <i class="fa-solid fa-user-tag"></i>
                                    <strong>Relationship:</strong>
                                    <span>${member.releationship_name || 'N/A'} (${member.relationship_code || 'N/A'})</span>
                                </div>
                                <div class="result-item">
                                    <i class="fa-solid fa-id-card"></i>
                                    <strong>Aadhaar Linked:</strong>
                                    <span style="color: ${member.uid === 'Yes' ? '#27ae60' : '#e74c3c'}">
                                        ${member.uid || 'No'}
                                    </span>
                                </div>
                            </div>
                        `;
                    });
                    
                    html += `</div>`;
                }
                
                html += `</div>`;
                output.innerHTML = html;
            } else {
                output.innerHTML = `
                    <div class="error-card">
                        <i class="fa-solid fa-exclamation-triangle"></i>
                        <p>No ration card found for this Aadhaar number</p>
                    </div>
                `;
            }
        }

        function displayVehicleResults(data, vehicle) {
            let output = document.getElementById('output');
            
            if(data && data.vehicle_response) {
                const vehicleData = data.vehicle_response;
                const challanData = data.challan_response;
                
                let html = `
                    <div class="success-message">
                        <i class="fa-solid fa-check-circle"></i> Vehicle details found successfully!
                    </div>
                    <div class="result-card">
                        <h3><i class="fa-solid fa-car"></i> Vehicle Details - ${vehicleData.asset_number || vehicle}</h3>
                        
                        <div class="result-section">
                            <h4><i class="fa-solid fa-user"></i> Owner Information</h4>
                            <div class="result-item">
                                <i class="fa-solid fa-user"></i>
                                <strong>Owner Name:</strong>
                                <span>${vehicleData.owner_name || 'N/A'}</span>
                            </div>
                            <div class="result-item">
                                <i class="fa-solid fa-id-card"></i>
                                <strong>Vehicle Number:</strong>
                                <span>${vehicleData.asset_number || vehicle}</span>
                            </div>
                            <div class="result-item">
                                <i class="fa-solid fa-calendar"></i>
                                <strong>Registration Date:</strong>
                                <span>${vehicleData.registration_date || 'N/A'}</span>
                            </div>
                        </div>
                        
                        <div class="result-section">
                            <h4><i class="fa-solid fa-car-side"></i> Vehicle Specifications</h4>
                            <div class="result-item">
                                <i class="fa-solid fa-industry"></i>
                                <strong>Make & Model:</strong>
                                <span>${vehicleData.make_model || 'N/A'}</span>
                            </div>
                            <div class="result-item">
                                <i class="fa-solid fa-industry"></i>
                                <strong>Manufacturer:</strong>
                                <span>${vehicleData.make_name || 'N/A'}</span>
                            </div>
                            <div class="result-item">
                                <i class="fa-solid fa-car"></i>
                                <strong>Vehicle Type:</strong>
                                <span>${vehicleData.vehicle_type || 'N/A'}</span>
                            </div>
                            <div class="result-item">
                                <i class="fa-solid fa-gas-pump"></i>
                                <strong>Fuel Type:</strong>
                                <span>${vehicleData.fuel_type || 'N/A'}</span>
                            </div>
                            <div class="result-item">
                                <i class="fa-solid fa-hashtag"></i>
                                <strong>Chassis Number:</strong>
                                <span>${vehicleData.chassis_number || 'N/A'}</span>
                            </div>
                            <div class="result-item">
                                <i class="fa-solid fa-cog"></i>
                                <strong>Engine Number:</strong>
                                <span>${vehicleData.engine_number || 'N/A'}</span>
                            </div>
                        </div>
                        
                        <div class="result-section">
                            <h4><i class="fa-solid fa-location-dot"></i> Registration Details</h4>
                            <div class="result-item">
                                <i class="fa-solid fa-map-marker-alt"></i>
                                <strong>Registration Address:</strong>
                                <span>${vehicleData.registration_address || 'N/A'}</span>
                            </div>
                            <div class="result-item">
                                <i class="fa-solid fa-home"></i>
                                <strong>Permanent Address:</strong>
                                <span>${vehicleData.permanent_address || 'N/A'}</span>
                            </div>
                            <div class="result-item">
                                <i class="fa-solid fa-home"></i>
                                <strong>Present Address:</strong>
                                <span>${vehicleData.present_address || 'N/A'}</span>
                            </div>
                        </div>
                        
                        <div class="result-section">
                            <h4><i class="fa-solid fa-file-contract"></i> Insurance Details</h4>
                            <div class="result-item">
                                <i class="fa-solid fa-shield-alt"></i>
                                <strong>Previous Insurer:</strong>
                                <span>${vehicleData.previous_insurer || 'N/A'}</span>
                            </div>
                            <div class="result-item">
                                <i class="fa-solid fa-calendar-times"></i>
                                <strong>Policy Expiry Date:</strong>
                                <span>${vehicleData.previous_policy_expiry_date || 'N/A'}</span>
                            </div>
                            <div class="result-item">
                                <i class="fa-solid fa-check-circle"></i>
                                <strong>Policy Status:</strong>
                                <span style="color: ${vehicleData.previous_policy_expired ? '#e74c3c' : '#27ae60'}">
                                    ${vehicleData.previous_policy_expired ? 'EXPIRED' : 'ACTIVE'}
                                </span>
                            </div>
                        </div>
                `;
                
                // Add challan information if available

                    challanData.data.forEach((challan, index) => {
                        html += `
                            <div class="challan-item">

                                <div class="result-item">

                                </div>
                                <div class="result-item">

                                    <span>₹${challan.amount.total || 'N/A'}</span>
                                </div>
                                <div class="result-item">
                                    <i class="fa-solid fa-flag"></i>
                                    <strong>Status:</strong>
                                    <span style="color: ${challan.challan_status === 'NON_PAYABLE' ? '#e74c3c' : '#27ae60'}">
                                        ${challan.challan_status || 'N/A'}
                                    </span>
                                </div>
                                <div class="result-item">
                                    <i class="fa-solid fa-calendar-day"></i>
                                    <strong>Violation Date:</strong>
                                    <span>${new Date(challan.violations.date).toLocaleDateString() || 'N/A'}</span>
                                </div>
                                <div class="result-item">
                                    <i class="fa-solid fa-ban"></i>
                                    <strong>Offence:</strong>
                                    <span>${challan.violations.details[0].offence || 'N/A'}</span>
                                </div>
                            </div>
                        `;
                    });
                    
                    html += `</div>`;
                }
                
                html += `</div>`;
                output.innerHTML = html;
            } else {
                output.innerHTML = `
                    <div class="error-card">
                        <i class="fa-solid fa-exclamation-triangle"></i>
                        <p>No vehicle found with this number</p>
                    </div>
                `;
            }
        }
